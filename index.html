<!DOCTYPE html>
<html lang="en" ng-app="cargoApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Shipment Management</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=5">

    <!-- AngularJS & Route -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.js"></script>
</head>

<body>

<!-- NAVIGATION BAR -->
<nav class="navbar navbar-expand-lg navbar-dark nav-custom shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand font-weight-bold" ng-href="#!/">
            <i class="fas fa-shipping-fast text-primary mr-2"></i> Cargo System
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ml-auto align-items-center">
                <li class="nav-item">
                    <a ng-href="#!/" class="nav-link"><i class="fas fa-home mr-1"></i> Home</a>
                </li>
                <li class="nav-item" ng-if="isLoggedIn()">
                    <a ng-href="#!/dashboard" class="nav-link"><i class="fas fa-chart-line mr-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a ng-href="#!/shipments" class="nav-link"><i class="fas fa-box mr-1"></i> Shipments</a>
                </li>
                <li class="nav-item" ng-if="isLoggedIn()">
                    <a ng-href="#!/add" class="nav-link"><i class="fas fa-plus-circle mr-1"></i> Add Shipment</a>
                </li>
                <li class="nav-item">
                    <a ng-href="#!/demo" class="nav-link"><i class="fas fa-flask mr-1"></i> Shipment History</a>
                </li>

                <!-- Logged Out Actions -->
                <li class="nav-item ml-lg-3" ng-if="!isLoggedIn()">
                    <a ng-href="#!/login" class="btn btn-outline-light btn-sm px-3 mr-2"><i class="fas fa-sign-in-alt mr-1"></i> Login</a>
                </li>
                <li class="nav-item" ng-if="!isLoggedIn()">
                    <a ng-href="#!/register" class="btn btn-primary text-white btn-sm px-3"><i class="fas fa-user-plus mr-1"></i> Register</a>
                </li>

                <!-- Logged In Actions -->
                <li class="nav-item ml-lg-3 d-flex align-items-center" ng-if="isLoggedIn()">
                    <span class="text-light small mr-3"><i class="fas fa-user-circle mr-1"></i> {{getCurrentUser().name}}</span>
                    <button class="btn btn-outline-light btn-sm px-3" ng-click="logout()"><i class="fas fa-sign-out-alt mr-1"></i> Logout</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN DYNAMIC CONTAINER -->
<main class="container my-5">
    <div ng-view class="fade-in"></div>
</main>

<!-- FOOTER -->
<footer class="footer text-center py-4 border-top mt-auto">
    <div class="container">
        <small>© Cargo Shipment System | Enterprise Logistics Dashboard</small>
    </div>
</footer>

<!-- DEPENDENCY SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="app.js"></script>

</body>
</html>
