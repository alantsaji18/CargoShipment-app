<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Item</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --focus-ring: rgba(79, 70, 229, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 560px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .header {
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group.row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.625rem 0.875rem;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #fff;
      color: var(--text-color);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background-color 0.15s ease;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #f1f5f9;
      color: var(--text-color);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    @media (max-width: 480px) {
      .form-group.row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>Add New Item</h1>
      <p>Fill out the form below to create a new record.</p>
    </header>

    <form id="addForm" action="/submit" method="POST">
      <!-- Title Input -->
      <div class="form-group">
        <label for="title">Title / Name *</label>
        <input type="text" id="title" name="title" placeholder="e.g., Project Planning" required>
      </div>

      <!-- Category & Status Row -->
      <div class="form-group row">
        <div>
          <label for="category">Category *</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Select category</option>
            <option value="general">General</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
          </select>
        </div>
        <div>
          <label for="price">Amount / Price ($)</label>
          <input type="number" id="price" name="price" step="0.01" min="0" placeholder="0.00">
        </div>
      </div>

      <!-- Description Textarea -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Add additional details or notes..."></textarea>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Entry</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('addForm').addEventListener('submit', function (event) {
      // Prevent default submit if you are using an API/Fetch call
      // event.preventDefault();

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      console.log('Form Data Submitted:', data);
      
      // Add your fetch API request or LocalStorage logic here if needed
    });
  </script>

</body>
</html>
