<div class="container-fluid py-5 min-vh-100 position-relative" 
     style="background: linear-gradient(rgba(15, 23, 42, 0.90), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=1920&q=80') center/cover fixed no-repeat;">

    <div class="container">
        
        <!-- PAGE HEADER -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
            <div>
                <h2 class="font-weight-bold text-white mb-1">
                    <i class="fas fa-plus-circle text-info mr-2"></i> Register New Dispatch
                </h2>
                <p class="text-light opacity-75 small mb-0">Create and initialize a new global freight shipment manifest.</p>
            </div>
            <div class="mt-3 mt-md-0">
                <a ng-href="#!/shipments" class="btn btn-outline-secondary btn-sm px-3 font-weight-bold text-white border-secondary">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Directory
                </a>
            </div>
        </div>

        <!-- FORM CARD -->
        <div class="card border-secondary shadow-lg text-white" 
             style="backdrop-filter: blur(12px); background-color: rgba(30, 41, 59, 0.85) !important;">
            <div class="card-body p-4 p-md-5">

                <form ng-submit="addShipment()">
                    
                    <!-- CONSIGNMENT PARTIES -->
                    <h5 class="font-weight-bold text-info mb-3"><i class="fas fa-users mr-2"></i> Party Information</h5>
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="small text-muted font-weight-bold">Sender (Consignor)</label>
                            <input type="text" class="form-control bg-secondary text-white border-0 shadow-none" 
                                   placeholder="e.g., Acme Cargo Corp" ng-model="newShipment.sender" required style="height: 45px;">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small text-muted font-weight-bold">Receiver (Consignee)</label>
                            <input type="text" class="form-control bg-secondary text-white border-0 shadow-none" 
                                   placeholder="e.g., Global Tech Ltd" ng-model="newShipment.receiver" required style="height: 45px;">
                        </div>
                    </div>

                    <!-- ROUTE VECTOR -->
                    <h5 class="font-weight-bold text-info mb-3"><i class="fas fa-route mr-2"></i> Route Vector & Details</h5>
                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="small text-muted font-weight-bold">Origin Location</label>
                            <input type="text" class="form-control bg-secondary text-white border-0 shadow-none" 
                                   placeholder="e.g., Shanghai" ng-model="newShipment.origin" required style="height: 45px;">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="small text-muted font-weight-bold">Destination Location</label>
                            <input type="text" class="form-control bg-secondary text-white border-0 shadow-none" 
                                   placeholder="e.g., Hamburg" ng-model="newShipment.destination" required style="height: 45px;">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="small text-muted font-weight-bold">Transport Mode</label>
                            <select class="form-control bg-secondary text-white border-0 shadow-none" 
                                    ng-model="newShipment.mode" required style="height: 45px;">
                                <option value="Air">Air Freight</option>
                                <option value="Sea">Sea Freight</option>
                                <option value="Road">Road Freight</option>
                                <option value="Rail">Rail Freight</option>
                                <option value="Express">Express Air</option>
                            </select>
                        </div>
                    </div>

                    <!-- LOGISTICS SPECIFICATIONS -->
                    <h5 class="font-weight-bold text-info mb-3"><i class="fas fa-boxes mr-2"></i> Logistics Specifications</h5>
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="small text-muted font-weight-bold">Weight (e.g., 350 kg)</label>
                            <input type="text" class="form-control bg-secondary text-white border-0 shadow-none" 
                                   placeholder="e.g., 350 kg" ng-model="newShipment.weight" required style="height: 45px;">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="small text-muted font-weight-bold">Estimated Delivery (ETA)</label>
                            <input type="date" class="form-control bg-secondary text-white border-0 shadow-none" 
                                   ng-model="newShipment.etaDate" required style="height: 45px;">
                        </div>
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <div class="text-right pt-2 border-top border-secondary">
                        <button type="submit" class="btn btn-info px-4 py-2 font-weight-bold shadow-sm">
                            <i class="fas fa-check-circle mr-1"></i> Confirm & Create Dispatch
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
