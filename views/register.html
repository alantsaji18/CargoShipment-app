<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-circle bg-soft-primary text-primary mx-auto mb-3">
                        <i class="fas fa-user-plus fa-lg"></i>
                    </div>
                    <h3 class="font-weight-bold">Create an Account</h3>
                    <p class="text-muted">Register to manage cargo shipments and deliveries</p>
                </div>

                <!-- Status Alerts -->
                <div class="alert alert-danger" ng-if="errorMessage">
                    <i class="fas fa-exclamation-circle mr-2"></i>{{errorMessage}}
                </div>
                <div class="alert alert-success" ng-if="successMessage">
                    <i class="fas fa-check-circle mr-2"></i>{{successMessage}}
                </div>

                <form ng-submit="register()">
                    <div class="form-group">
                        <label class="font-weight-medium">Full Name</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                            </div>
                            <input type="text" class="form-control" ng-model="user.fullName" placeholder="e.g. full name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-medium">Email Address</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            </div>
                            <input type="email" class="form-control" ng-model="user.email" placeholder="name@gmail.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-medium">Username</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                            </div>
                            <input type="text" class="form-control" ng-model="user.username" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="font-weight-medium">Password</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                </div>
                                <input type="password" class="form-control" ng-model="user.password" placeholder="Create password" required>
                            </div>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="font-weight-medium">Confirm Password</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-check-double"></i></span>
                                </div>
                                <input type="password" class="form-control" ng-model="user.confirmPassword" placeholder="Repeat password" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg shadow-sm mt-3">
                        <i class="fas fa-user-check mr-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted">Already have an account?</span>
                    <a ng-href="#!/login" class="font-weight-bold ml-1">Sign In here</a>
                </div>
            </div>
        </div>
    </div>
</div>
