<div class="container-fluid py-5 min-vh-100 d-flex align-items-center justify-content-center position-relative" 
     style="background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=1920&q=80') center/cover fixed no-repeat;">

    <div class="row justify-content-center w-100">
        <div class="col-xl-4 col-lg-5 col-md-7 col-sm-10">
            
            <div class="card bg-dark text-white border-secondary shadow-lg overflow-hidden" 
                 style="backdrop-filter: blur(12px); background-color: rgba(30, 41, 59, 0.85) !important;">
                
                <!-- HEADER BANNER -->
                <div class="p-4 border-bottom border-secondary text-center position-relative" 
                     style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=800&q=80') center/cover;">
                    <div class="mb-2">
                        <i class="fas fa-boxes text-primary fa-2x"></i>
                    </div>
                    <h3 class="font-weight-bold text-white mb-1">Cargo Management</h3>
                    <p class="text-light small mb-0">Sign in to access real-time dispatch & global route telemetry.</p>
                </div>

                <!-- LOGIN FORM -->
                <div class="card-body p-4 p-md-5">

                    <!-- REGISTRATION SUCCESS ALERT -->
                    <div class="alert alert-success text-center small mb-4 py-2" ng-if="regSuccess">
                        <i class="fas fa-check-circle mr-1"></i> Account created successfully! Please sign in.
                    </div>

                    <!-- AUTH ERROR ALERT -->
                    <div class="alert alert-danger text-center small mb-4 py-2" ng-if="authError">
                        <i class="fas fa-exclamation-circle mr-1"></i> {{authError}}
                    </div>

                    <form ng-submit="loginUser()">
                        
                        <!-- Email Input -->
                        <div class="form-group mb-4">
                            <label class="small text-muted font-weight-bold">Email Address / Operator ID</label>
                            <div class="position-relative">
                                <i class="fas fa-envelope position-absolute text-muted" style="left: 15px; top: 50%; transform: translateY(-50%);"></i>
                                <input type="email" class="form-control bg-secondary text-white border-0 shadow-none custom-login-input" 
                                       placeholder="operator@cargosystem.com" 
                                       ng-model="credentials.email" required 
                                       style="height: 45px; padding-left: 42px !important;">
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="form-group mb-4">
                            <label class="small text-muted font-weight-bold">Security Password</label>
                            <div class="position-relative">
                                <i class="fas fa-lock position-absolute text-muted" style="left: 15px; top: 50%; transform: translateY(-50%);"></i>
                                <input type="password" class="form-control bg-secondary text-white border-0 shadow-none custom-login-input" 
                                       placeholder="••••••••••••" 
                                       ng-model="credentials.password" required 
                                       style="height: 45px; padding-left: 42px !important;">
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary btn-block py-2 font-weight-bold shadow-sm mb-3">
                            <i class="fas fa-sign-in-alt mr-2"></i> Access Operations Terminal
                        </button>

                        <!-- Footer Links -->
                        <div class="text-center pt-2 border-top border-secondary">
                            <span class="small text-muted">Don't have an operator account? </span>
                            <a ng-href="#!/register" class="small text-info font-weight-bold">Register Account</a>
                        </div>

                    </form>
                </div>

            </div>

        </div>
    </div>
</div>

<style>
    .custom-login-input::placeholder {
        color: #a0aec0 !important;
        opacity: 1 !important;
    }
</style>
